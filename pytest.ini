[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths =
    tests
    accounts
    api
    web
    sso
    mfa
    passwords
    organizations
    security_policies
    security_events
    sessions
    notifications
    ops
addopts = -ra --strict-markers -q
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
