# Alertmanager routing. Two working default paths that need no paid pager:
#   - webhook  -> the app's /internal/alerts sink (logged, queryable, unit-tested)
#   - email    -> on-call inbox (fill in the SMTP env below)
# Upgrade the `pager` receiver to PagerDuty/Opsgenie for real paging.
route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 30s
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: pager
      continue: true
    - matchers: [severity="page"]
      receiver: email

receivers:
  - name: webhook
    webhook_configs:
      - url: http://web:8000/internal/alerts
        # send_resolved: true
        # http_config: { authorization: { credentials: "${ALERT_WEBHOOK_TOKEN}" } }

  - name: email
    email_configs:
      - to: "oncall@example.test"
        from: "alerts@example.test"
        smarthost: "smtp:587"
        auth_username: "${SMTP_USER}"
        auth_password: "${SMTP_PASSWORD}"
        require_tls: true

  - name: pager
    # pagerduty_configs:
    #   - routing_key: "${PAGERDUTY_ROUTING_KEY}"
    webhook_configs:
      - url: http://web:8000/internal/alerts   # fallback until a real pager key is set
