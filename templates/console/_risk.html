<section class="panel">
  <h1>Risk events</h1>
  <table>
    <thead><tr><th>When</th><th>Type</th><th>Severity</th><th>User</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for e in events %}
        <tr>
          <td>{{ e.created_at }}</td><td>{{ e.event_type }}</td><td>{{ e.severity }}</td>
          <td>{{ e.user.username|default:"-" }}</td><td>{{ e.status }}</td>
          <td>{% if e.status == "open" %}
            <button hx-post="{% url 'web:console_risk_resolve' e.id %}" hx-vals='{"status":"resolved"}' hx-target="#console-main">Resolve</button>
            <button hx-post="{% url 'web:console_risk_resolve' e.id %}" hx-vals='{"status":"false_positive"}' hx-target="#console-main">False positive</button>
          {% endif %}</td>
        </tr>
      {% empty %}<tr><td colspan="6">No risk events.</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
