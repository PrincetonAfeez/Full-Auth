<section class="panel">
  <h1>Audit log</h1>
  <table>
    <thead><tr><th>When</th><th>Type</th><th>Actor</th><th>Target</th><th>Request</th></tr></thead>
    <tbody>
      {% for e in events %}
        <tr>
          <td>{{ e.timestamp }}</td><td>{{ e.event_type }}</td>
          <td>{{ e.actor.username|default:"-" }}</td><td>{{ e.target_user.username|default:"-" }}</td>
          <td>{{ e.request_id|default:"-"|truncatechars:12 }}</td>
        </tr>
      {% empty %}<tr><td colspan="5">No audit events.</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
