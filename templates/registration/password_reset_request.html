{% extends "web/base.html" %}
{% block content %}
<form method="post">
  {% csrf_token %}
  <h1>Reset your password</h1>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <button type="submit">Send reset link</button>
</form>
{% endblock %}
