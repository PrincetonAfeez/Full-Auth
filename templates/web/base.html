<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Full Auth</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color: #16202a; background: #f6f7f9; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #101820; color: white; }
      main { max-width: 960px; margin: 32px auto; padding: 0 20px; }
      form, .panel { background: white; border: 1px solid #dde2e8; border-radius: 8px; padding: 20px; }
      label { display: block; font-weight: 650; margin-top: 12px; }
      input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #b8c2cc; border-radius: 6px; }
      button, .button { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 6px; background: #145c9e; color: white; text-decoration: none; font-weight: 700; cursor: pointer; }
      nav a, nav button { color: white; background: transparent; border: 0; margin-left: 12px; text-decoration: none; }
      .messages { margin-bottom: 16px; }
      .messages div { padding: 10px 12px; border-radius: 6px; background: #fff4cc; }
      table { width: 100%; border-collapse: collapse; background: white; }
      th, td { text-align: left; padding: 10px; border-bottom: 1px solid #dde2e8; }
    </style>
  </head>
  <body>
    <header>
      <strong>Full Auth</strong>
      <nav>
        {% if request.user.is_authenticated %}
          <a href="{% url 'web:dashboard' %}">Dashboard</a>
          <a href="{% url 'web:security' %}">Security</a>
          <form method="post" action="{% url 'web:logout' %}" style="display:inline;background:transparent;border:0;padding:0">{% csrf_token %}<button>Log out</button></form>
        {% else %}
          <a href="{% url 'web:login' %}">Log in</a>
          <a href="{% url 'web:register' %}">Register</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% if messages %}
        <div class="messages">{% for message in messages %}<div>{{ message }}</div>{% endfor %}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
